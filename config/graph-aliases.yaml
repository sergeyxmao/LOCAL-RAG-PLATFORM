schema_version: 1
# Канонические значения signal_kind и их алиасы.
# Парсер при сохранении сигнала:
#   - attributes.signal_kind_raw = как написано в XLSX (всегда сохраняется);
#   - attributes.signal_kind = найденная каноническая форма (или null, если не нашли).
# Сравнение нечувствительно к регистру и пробелам, поддержаны точные совпадения
# и совпадение по префиксу.
signal_kind:
  AI:
    description: Аналоговый вход 4-20 мА
    aliases:
      - AI
      - 1AI
      - AIN
      - Аналоговый вход
      - Анал.вх
      - Анал.вход
      - Analog Input
      - 4-20 мА
      - Аналоговые входные сигналы 4-20 мА
      - HART current loop

  AO:
    description: "Аналоговый выход 4-20 мА"
    aliases:
      - "AO"
      - "1AO"
      - "AOUT"
      - "Аналоговый выход"
      - "Анал.выход"
      - "Analog Output"
      - "Анал.выход 4-20 мА"

  DI:
    description: "Дискретный вход 24В"
    aliases:
      - "DI"
      - "1DI"
      - "DIN"
      - "Дискретный вход"
      - "Диск.вх"
      - "Дискретные входные сигналы 24В"
      - "24В вход"
      - "Digital Input"

  DO:
    description: "Дискретный выход"
    aliases:
      - "DO"
      - "1DO"
      - "DOUT"
      - "Дискретный выход"
      - "Диск.выход"
      - "Открытый коллектор"
      - "Digital Output"

  RTD:
    description: "Термосопротивление (Pt100, Cu100 и т.п.)"
    aliases:
      - "RTD"
      - "Pt100"
      - "Cu100"
      - "Термосопротивление"
      - "Термопара"
      - "TC"

  FI:
    description: "Частотный вход"
    aliases:
      - "FI"
      - "Частотный вход"
      - "Frequency Input"
      - "Импульсный вход"

  RS:
    description: "Последовательный (Modbus RTU / RS485)"
    aliases:
      - "RS"
      - "RS485"
      - "RS-485"
      - "Modbus RTU"
      - "Modbus"
      - "Serial"
