services:
  postgres:
    image: postgres:16
    container_name: localrag-postgres
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - ../workspace/postgres_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    networks:
      - localrag-net

  qdrant:
    image: qdrant/qdrant:latest
    container_name: localrag-qdrant
    restart: unless-stopped
    ports:
      - "${QDRANT_HTTP_PORT}:6333"
      - "${QDRANT_GRPC_PORT}:6334"
    volumes:
      - ../workspace/qdrant_data:/qdrant/storage
    networks:
      - localrag-net

  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: localrag-open-webui
    restart: unless-stopped
    ports:
      - "${OPEN_WEBUI_PORT}:8080"
    environment:
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL}
    volumes:
      - ../workspace/openwebui_data:/app/backend/data
    networks:
      - localrag-net

  kb-api:
    build:
      context: ../apps/kb-api
    container_name: localrag-kb-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      RERANKER_LOCAL_URL: ${RERANKER_LOCAL_URL:-http://localrag-reranker:8090}
      RERANKER_TIMEOUT_MS: ${RERANKER_TIMEOUT_MS:-45000}
      CLOUD_CHAT_TIMEOUT_MS: ${CLOUD_CHAT_TIMEOUT_MS:-180000}
    ports:
      - "${KB_API_PORT}:8787"
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started
    volumes:
      - ../config:/app/config
      - ../data:/app/data
    healthcheck:
      # busybox wget есть в node:20-alpine; /health отвечает без обращения к LLM.
      test: ["CMD", "wget", "-qO-", "http://localhost:8787/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - localrag-net

  reranker:
    # Опциональный локальный reranker-сервис (bge-reranker-base, CPU).
    # Если контейнер не поднят, kb-api автоматически делает fallback на
    # эвристику или облачный Jina (см. docs/RERANKER_SERVICE.md).
    build:
      context: ../apps/reranker-service
    container_name: localrag-reranker
    restart: unless-stopped
    environment:
      MODEL: ${RERANKER_MODEL:-BAAI/bge-reranker-base}
      DEVICE: ${RERANKER_DEVICE:-cpu}
      MAX_LENGTH: ${RERANKER_MAX_LENGTH:-512}
      HOST: 0.0.0.0
      PORT: 8090
    ports:
      - "${RERANKER_PORT:-8090}:8090"
    volumes:
      - ../workspace/reranker_cache:/data/hf-cache
    mem_limit: 2g
    mem_reservation: 768m
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8090/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 120s
    networks:
      - localrag-net

  ingestion-worker:
    # Пока каркас: только heartbeat-лог, вся логика импорта живёт в kb-api.
    # Спрятан за профиль, чтобы не занимать RAM слабого ноутбука. Запуск при
    # необходимости: docker compose --profile experimental up -d
    profiles:
      - experimental
    build:
      context: ../apps/ingestion-worker
    container_name: localrag-ingestion-worker
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started
    volumes:
      - ../config:/app/config
      - ../data:/app/data
    networks:
      - localrag-net

networks:
  localrag-net:
    driver: bridge
